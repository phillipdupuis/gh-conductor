    <script>
      // Deliver ResizeObserver callbacks on the next frame. React Flow resizes what it observes, which
      // makes browsers report the harmless "ResizeObserver loop completed with undelivered

      window.ResizeObserver = class extends ResizeObserver {
        constructor(cb) {
          super((entries, observer) => requestAnimationFrame(() => cb(entries, observer)));
        }
      };
